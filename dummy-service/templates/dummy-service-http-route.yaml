{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-route
spec:
  parentRefs:
    - name: nginx-gateway-fabric-gateway
  hostnames:
    - "dummyservice.kubernetes.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-service
          port: 80
{{ end }}